# Security invariant — a technician must NEVER see a dollar figure anywhere.
#
# This is the end-to-end backstop on a real build for a boundary that is already
# enforced at three other layers, each independently verified:
#   • RLS (migrations 0035/0038) — role-impersonation tested in production
#   • the sync path — a technician's PowerSync mirror carries no money tables and
#     no `rate` column (verified live via the Sync Diagnostics client)
#   • the UI — MoneyText / RoleGate unit tests
# So this flow is the fourth check, not the only one. It is READ-ONLY: it
# navigates and asserts, and writes nothing.
#
# TARGETING NOTE: React Native flattens view hierarchies, so a `testID` on a
# Touchable wrapper never reaches the native tree. Text surfaces; testIDs on
# wrappers do not. This flow targets text — which is exactly right here, since
# the invariant IS about what text a technician can see.
appId: au.com.mellerick.field
env:
  EMAIL: ${TECH_EMAIL}
  PASSWORD: ${TECH_PASSWORD}
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${TECH_EMAIL}
      PASSWORD: ${TECH_PASSWORD}
      LANDING: "My Jobs"
# ---------------------------------------------------------------------------
# PRECONDITION, not part of the invariant under test.
#
# The login subflow is deliberately conditional — it reuses a session a human
# already signed in by hand, so a password never passes through a script. The
# cost is that this flow will happily run against an OFFICE or ADMIN session and
# then fail on the money assertions below, which reads exactly like a money leak
# when it is nothing of the sort.
#
# That happened the first time this flow was ever executed (2026-08-03): the
# device was signed in as an admin, "Approvals" was visible, and the failure
# looked like a security regression rather than a wrong-role harness problem.
#
# So the role check comes first and says what it means. LANDING alone cannot do
# this job — admins also have a "My Jobs" entry (D83), so it matches for both
# roles.
# ---------------------------------------------------------------------------
- assertNotVisible:
    text: "Approvals"
    label: "PRECONDITION — session must be a TECHNICIAN. If this fails, the device is signed in as office/admin: sign out, or rerun with CLEAR_STATE=true and TECH_EMAIL/TECH_PASSWORD. It is NOT a money leak."
# From here the assertions ARE the invariant: office/admin money areas are never
# registered for a technician, so their absence is structural rather than hidden.
- assertNotVisible:
    text: "Dashboard"
    label: "technician shell exposes no Dashboard"
- assertNotVisible:
    text: "Schedule"
    label: "technician shell exposes no Schedule"
# No dollar figure on the jobs list.
- assertNotVisible: ".*\\$[0-9].*"
# ---------------------------------------------------------------------------
# PRECONDITION — this technician must actually HAVE a job.
#
# Everything above is an assertNotVisible, and every one of them is trivially
# true against an empty job list. The tap below is what forces this flow to
# engage with real data, and without this label its failure reads
# "Element not found: #.* — .*", which looks like a UI regression rather than a
# missing fixture — the same misdiagnosis the role check above exists to prevent.
#
# It is stated as its own assertion so the flow says WHY it stopped. A green run
# of this flow is only meaningful when it walked into a populated job; if that is
# impossible, the flow must fail rather than report a pass it did not earn.
# ---------------------------------------------------------------------------
- assertVisible:
    text: "#.* — .*"
    label: "PRECONDITION — the signed-in technician has NO jobs assigned. The money assertions above are vacuous against an empty list, so this flow cannot prove anything. Assign a job to this technician and rerun. It is NOT a money leak and NOT a UI regression."
# Open a job and sweep the tabs a technician can reach — none may show money.
- tapOn: "#.* — .*"
- extendedWaitUntil:
    visible: "Time"
    timeout: 30000
- assertNotVisible: "Billing"
- assertNotVisible: "Costing"
- assertNotVisible: ".*\\$[0-9].*"
- tapOn: "Time"
- assertNotVisible: ".*\\$[0-9].*"
- tapOn: "Variations"
- assertNotVisible: ".*\\$[0-9].*"
# Variations are the sharpest case: a technician logs quantity/unit but the rate
# and total belong to the office. Their absence here is the money contract.
- assertNotVisible: "Rate"
- assertNotVisible: "Total"
