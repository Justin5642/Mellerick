# PowerSync SYNC STREAMS (edition 3) — Mellerick Field
# =============================================================================
# The live instance runs Sync Streams edition 3, NOT legacy Sync Rules — so this
# replaces sync-rules.yaml (kept for reference) in the new dialect:
#   • auth.user_id()            instead of request.user_id()
#   • streams:                  instead of bucket_definitions:
#   • IN (subquery) is supported ONLY with a column of the streamed table on the
#     left; IN with a LITERAL LIST (role IN ('office','admin')) is NOT supported
#     at all — use OR-equalities instead
#   • JOIN profiles ON profiles.id = auth.user_id() IS legal — the office/admin
#     role gate below uses exactly that shape
#   • auto_subscribe: true      = every client subscribes; per-user filtering
#     happens in the query, and a non-matching user gets ZERO rows (fail-closed)
#
# VALIDATED against the live instance (dashboard Validate, 2026-07-27) after
# three fixes: job_notes columns are (content, author_id) not (note,
# created_by); the gate `auth.user_id() IN (SELECT …)` and every literal
# `IN ('office','admin')` were rejected — final form is the JOIN + OR gate.
#
# MONEY CONTRACT (authoritative — same boundary as RLS 0027/0035/0038):
#   technicians must never receive a money column. Office/admin streams are
#   role-gated on profiles.role; technician streams are scoped to their jobs and
#   rate-stripped. RLS remains the authority underneath.
#
# MAINTENANCE HAZARD: every table here must ALSO be in the scoped `powersync`
# publication (migration 0039). Add a table to a stream without
# `alter publication powersync add table <t>` and it silently never syncs.
# =============================================================================

config:
  edition: 3

streams:
  # ---- Reference data, all roles (no money columns) --------------------------
  profiles:
    auto_subscribe: true
    query: SELECT id, full_name, role FROM profiles

  customers:
    auto_subscribe: true
    query: SELECT id, name, company, phone, email, mobile, abn, is_active, is_favorite FROM customers

  sites:
    auto_subscribe: true
    query: SELECT id, customer_id, name, address_line1, address_line2, suburb, state, postcode, site_lat, site_lng FROM sites

  # RATE-STRIPPED: the base table's preset `rate` must never reach a device.
  variation_types:
    auto_subscribe: true
    query: SELECT id, name, unit, auto_approve, is_active FROM variation_types

  # Backflow compliance data (no money; matches the authenticated RLS posture —
  # technicians register devices and log tests in the field).
  backflow_devices:
    auto_subscribe: true
    query: SELECT * FROM backflow_devices

  backflow_tests:
    auto_subscribe: true
    query: SELECT * FROM backflow_tests

  # ---- Technician: their assigned jobs + children, MONEY-STRIPPED ------------
  tech_jobs:
    auto_subscribe: true
    query: |
      SELECT id, job_number, title, description, notes, status, priority, job_type,
             customer_id, site_id, assigned_to, scheduled_start, scheduled_end,
             actual_start, actual_end, completion_notes, voice_report_transcript, created_at
      FROM jobs WHERE assigned_to = auth.user_id()

  tech_job_photos:
    auto_subscribe: true
    query: |
      SELECT id, job_id, storage_path, photo_type, uploaded_by, created_at
      FROM job_photos
      WHERE job_id IN (SELECT id FROM jobs WHERE assigned_to = auth.user_id())

  tech_job_notes:
    auto_subscribe: true
    query: |
      SELECT id, job_id, content, author_id, created_at
      FROM job_notes
      WHERE job_id IN (SELECT id FROM jobs WHERE assigned_to = auth.user_id())

  tech_time_entries:
    auto_subscribe: true
    query: |
      SELECT id, job_id, staff_id, clock_in, clock_out, hours, entry_type, cost_center_id, notes, created_at
      FROM time_entries
      WHERE job_id IN (SELECT id FROM jobs WHERE assigned_to = auth.user_id())

  # RATE-STRIPPED: omits rate, total_amount, admin_notes.
  tech_job_variations:
    auto_subscribe: true
    query: |
      SELECT id, job_id, variation_type_id, custom_name, description, quantity, unit,
             status, photo_storage_path, logged_by, logged_at
      FROM job_variations
      WHERE job_id IN (SELECT id FROM jobs WHERE assigned_to = auth.user_id())

  # ---- Office/admin: full business set (money allowed), ROLE-GATED -----------
  # Gate: JOIN the requesting user's profiles row; the stream only yields rows
  # when that row exists AND its role is office/admin. A technician (or missing
  # profile) joins to nothing — fail-closed.
  office_jobs:
    auto_subscribe: true
    query: SELECT jobs.* FROM jobs JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_job_items:
    auto_subscribe: true
    query: SELECT job_items.* FROM job_items JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_job_variations:
    auto_subscribe: true
    query: SELECT job_variations.* FROM job_variations JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_job_expenses:
    auto_subscribe: true
    query: SELECT job_expenses.* FROM job_expenses JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_job_notes:
    auto_subscribe: true
    query: SELECT job_notes.* FROM job_notes JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_invoices:
    auto_subscribe: true
    query: SELECT invoices.* FROM invoices JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_invoice_items:
    auto_subscribe: true
    query: SELECT invoice_items.* FROM invoice_items JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_quotes:
    auto_subscribe: true
    query: SELECT quotes.* FROM quotes JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_quote_items:
    auto_subscribe: true
    query: SELECT quote_items.* FROM quote_items JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_pricing_items:
    auto_subscribe: true
    query: SELECT pricing_items.* FROM pricing_items JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_inventory:
    auto_subscribe: true
    query: SELECT inventory.* FROM inventory JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_equipment:
    auto_subscribe: true
    query: SELECT equipment.* FROM equipment JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_equipment_expenses:
    auto_subscribe: true
    query: SELECT equipment_expenses.* FROM equipment_expenses JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_equipment_usage_log:
    auto_subscribe: true
    query: SELECT equipment_usage_log.* FROM equipment_usage_log JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_purchase_orders:
    auto_subscribe: true
    query: SELECT purchase_orders.* FROM purchase_orders JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_po_cost_centers:
    auto_subscribe: true
    query: SELECT po_cost_centers.* FROM po_cost_centers JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_time_entries:
    auto_subscribe: true
    query: SELECT time_entries.* FROM time_entries JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'

  office_job_photos:
    auto_subscribe: true
    query: SELECT job_photos.* FROM job_photos JOIN profiles ON profiles.id = auth.user_id() WHERE profiles.role = 'office' OR profiles.role = 'admin'
