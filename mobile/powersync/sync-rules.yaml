# PowerSync sync rules — Mellerick Field  (PROPOSED / MP3)
# =============================================================================
# Rewritten against the official PowerSync docs (docs.powersync.com/usage/
# sync-rules + .../data-queries + .../operators-and-functions). The FIRST draft
# of this file was materially wrong and would have been rejected — it used
# subqueries (`WHERE job_id IN (SELECT ...)`) and a scalar subquery for the role
# check, and legacy Sync Rules support NONE of:
#     "Subqueries, JOINs, CTEs, aggregation, sorting, or set operations"
# It also broke the hard constraint that **every data query must use every
# bucket parameter**.
#
# The documented pattern instead makes the PARAMETER query return the parent
# row ids — one bucket per job — and every data query then filters on
# `bucket.job_id`. That is what this file now does.
#
# STILL UNVERIFIED (needs a real instance — see README "Open question"):
#   * the office/admin bucket's role gate (marked below)
# Nothing here has been run against a PowerSync instance yet.
#
# WHY THIS FILE IS SECURITY-CRITICAL: PowerSync replicates rows into plaintext
# SQLite ON THE DEVICE, bypassing the app's UI money-gating (MoneyText) and the
# read-repository layer. The per-column selects below are therefore a SECOND
# authorization surface alongside RLS (0027 / 0035 / 0038). A technician bucket
# must contain ZERO money columns.
# =============================================================================

bucket_definitions:
  # ---------------------------------------------------------------------------
  # GLOBAL: reference data every authenticated employee needs. No parameters, so
  # no per-row scoping — only put NON-money, non-sensitive columns here.
  # ---------------------------------------------------------------------------
  global_reference:
    data:
      - SELECT id, full_name, role FROM profiles
      # Customers/sites carry no money columns (techs need the customer name and
      # the site address for their jobs).
      - SELECT id, name, company, phone, email, mobile, abn, is_active, is_favorite FROM customers
      - SELECT id, customer_id, name, address_line1, address_line2, suburb, state, postcode, site_lat, site_lng FROM sites
      # RATE-STRIPPED: variation_types.rate must never reach a device.
      - SELECT id, name, unit, auto_approve, is_active FROM variation_types

  # ---------------------------------------------------------------------------
  # TECHNICIAN: one bucket PER JOB assigned to the caller. This is the documented
  # "grouping by parameter query values" pattern — the parameter query yields the
  # job ids, and every data query below filters on `bucket.job_id`, satisfying
  # the "each data query must use every bucket parameter" rule.
  #
  # No role gate is needed here: the bucket only instantiates for jobs where
  # `assigned_to` is the caller, so a non-technician simply gets no buckets.
  # ---------------------------------------------------------------------------
  assigned_job:
    parameters: SELECT id as job_id FROM jobs WHERE assigned_to = request.user_id()
    data:
      - SELECT id, job_number, title, description, notes, status, priority, job_type,
               customer_id, site_id, assigned_to, scheduled_start, scheduled_end,
               actual_start, actual_end, completion_notes, voice_report_transcript, created_at
          FROM jobs WHERE id = bucket.job_id
      - SELECT id, job_id, storage_path, photo_type, uploaded_by, created_at
          FROM job_photos WHERE job_id = bucket.job_id
      - SELECT id, job_id, staff_id, clock_in, clock_out, hours, entry_type, cost_center_id, notes, created_at
          FROM time_entries WHERE job_id = bucket.job_id
      - SELECT id, job_id, note, created_by, created_at
          FROM job_notes WHERE job_id = bucket.job_id
      # RATE-STRIPPED: omits rate, total_amount and admin_notes.
      - SELECT id, job_id, variation_type_id, custom_name, description, quantity, unit,
               status, photo_storage_path, logged_by, logged_at
          FROM job_variations WHERE job_id = bucket.job_id

  # ---------------------------------------------------------------------------
  # OFFICE / ADMIN: the broader business set, money included (they are authorised
  # to see it; RLS remains the backstop).
  #
  # ⚠️ OPEN QUESTION — the role gate. A global bucket has no parameters, so it
  # cannot be filtered by role; but a parameterised bucket requires EVERY data
  # query to use that parameter, which a whole-table sync cannot do. Legacy sync
  # rules also can't do the scalar subquery the first draft used. Resolve ONE of:
  #   (a) put the app role in a JWT custom claim via a Supabase Auth Hook and
  #       gate with `request.jwt() ->> 'app_role'`  ← preferred, no extra query;
  #   (b) use PowerSync "Sync Streams" (the newer mode) instead of legacy Sync
  #       Rules — it DOES support subqueries, JOINs and CTEs, which would also
  #       let the technician bucket be expressed more directly; or
  #   (c) rely on RLS alone for this bucket, accepting that the sync rules stop
  #       being a defence-in-depth layer for office data.
  # DO NOT deploy this bucket until one of those is chosen — as written it has no
  # role gate, so it would replicate money to EVERY authenticated device,
  # including technicians'. This is the single most dangerous line in the file.
  # ---------------------------------------------------------------------------
  office_admin_business:
    # parameters: <role gate — see the open question above>
    data:
      - SELECT * FROM jobs
      - SELECT * FROM job_items
      - SELECT * FROM job_variations
      - SELECT * FROM job_expenses
      - SELECT * FROM invoices
      - SELECT * FROM invoice_items
      - SELECT * FROM quotes
      - SELECT * FROM quote_items
      - SELECT * FROM pricing_items
      - SELECT * FROM inventory
      - SELECT * FROM equipment
      - SELECT * FROM equipment_expenses
      - SELECT * FROM equipment_usage_log
      - SELECT * FROM purchase_orders
      - SELECT * FROM po_cost_centers
      - SELECT * FROM time_entries
      - SELECT * FROM job_photos
      - SELECT * FROM backflow_devices
      - SELECT * FROM backflow_tests
