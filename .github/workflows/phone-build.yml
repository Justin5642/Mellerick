name: Build phone app

# Production phone builds on Expo (EAS), started by hand from the Actions tab
# (or by Claude through the GitHub API) instead of from someone's Mac.
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings →
# Access tokens). Builds run on Expo's servers; this job just starts them and
# waits so a failure shows up red here, with Expo's build link in the log.
#
# iPhone: built and sent to TestFlight (`--auto-submit`; the App Store Connect
# key lives on Expo's servers). Android: built only. Google's service-account
# keys are blocked by the organisation policy, so the .aab is downloaded from
# expo.dev and uploaded to Play Console by hand.
# Build numbers come from Expo (`appVersionSource: remote`, `autoIncrement`).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency:
  group: phone-build
  cancel-in-progress: false

jobs:
  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
      - name: Read the Expo token
        # A pasted secret can carry a stray line break or a label line, which
        # Expo rejects as "not a legal HTTP header value". Try each non-empty
        # line (trimmed) and keep the first one Expo accepts.
        env:
          RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          found=""
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "::add-mask::$line"
            if EXPO_TOKEN="$line" eas whoami >/dev/null 2>&1; then found="$line"; break; fi
          done <<< "$RAW_EXPO_TOKEN"
          if [ -z "$found" ]; then
            echo "::error::Expo did not accept the EXPO_TOKEN repository secret. Create a new token on expo.dev and paste only the token."
            exit 1
          fi
          echo "EXPO_TOKEN=$found" >> "$GITHUB_ENV"
          EXPO_TOKEN="$found" eas whoami
      - run: npm ci
      - run: eas build --platform ios --profile production --auto-submit --non-interactive

  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
      - name: Read the Expo token
        # A pasted secret can carry a stray line break or a label line, which
        # Expo rejects as "not a legal HTTP header value". Try each non-empty
        # line (trimmed) and keep the first one Expo accepts.
        env:
          RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          found=""
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "::add-mask::$line"
            if EXPO_TOKEN="$line" eas whoami >/dev/null 2>&1; then found="$line"; break; fi
          done <<< "$RAW_EXPO_TOKEN"
          if [ -z "$found" ]; then
            echo "::error::Expo did not accept the EXPO_TOKEN repository secret. Create a new token on expo.dev and paste only the token."
            exit 1
          fi
          echo "EXPO_TOKEN=$found" >> "$GITHUB_ENV"
          EXPO_TOKEN="$found" eas whoami
      - run: npm ci
      - run: eas build --platform android --profile production --non-interactive
